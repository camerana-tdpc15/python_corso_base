<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <!-- BS5 REFERENCE -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        #img {
            width: -214px;
            height: -214px;
        }
    </style>
</head>

<body class="d-flex flex-column h-100">

    <header>
        {% include 'includes/navbar.html' %}
    </header>

    <h1 class="jumboron text-center text-primary mt-3 ">Home</h1>




    <h4 class="text-center mt-4 text-secondary">Questi sono i nostri prodotti!</h4>

    <br>


    <main class="flex-shrink-0">
        <div class="container mt-4">
            <div class="row ">
                {% for prodotto in prodotti %}
                <div class="col-md-4">
                    <div class="card mb-4 shadow-sm mt-5" id="img">
                        <img src="{{ url_for('static', filename='imgs/'+prodotto.image) }}"
                            class="bd-placeholder-img  card-img-top">
                        <div class="card-body">
                            <p class="card-text">{{ prodotto.title }}</p>

                            <p><a href="{{ url_for('home') }}" class="btn btn-primary">Acquista</a>
                            </p>
                        </div>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </main>





</body>

</html>
