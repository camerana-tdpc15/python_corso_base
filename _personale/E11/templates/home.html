<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
     <!-- BS5 REFERENCE -->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="container">

<div class="text-center m-5">
    {% if 'user_id' in session %}
    <h2>Benvenuto, {{ utente.username }}!</h2>
    <h3><a href="{{ url_for('acquista') }}">I nostri lotti prenotabili</a>.</h3>
    <h3>Oppure <a href="{{ url_for('logout') }}">fai il Logout</a>.</h3>
    {% else %}
    <h3>
        Per prenotare i notri lotti fai <a href="{{ url_for('login') }}">Login</a>
        oppure, se non hai un account, fai il <a href="{{ url_for('signup') }}">Sign Up</a>
    </h3>
    {% endif %}
</div>
</body>

</html>
