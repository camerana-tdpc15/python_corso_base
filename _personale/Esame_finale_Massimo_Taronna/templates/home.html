    {% extends "base.html" %}
    {% block title %}Home{% endblock %}
    {% block content %}
    
    <div class="container">
        {% if user %}
            <h2 class="mb-3" id="ciao-user.nome-ecco-i-prossimi-eventi">Ciao {{ user.nome }}, ecco i prossimi eventi:</h2>
        {% else %}
            <h2 class="mb-3" id="benvenuti-ecco-i-prossimi-event">Benvenuti, ecco i prossimi eventi</h2>
        {% endif %}
    
        <div id="row-lotti" class="row">
            <!-- Il contenuto di questo div sarà popolato dinamicamente da repliche.js -->
        </div>
    </div>
    
    <!-- Includi lo script repliche.js -->
    <script src="{{ url_for('static', filename='scripts/repliche.js') }}"></script>
    
    {% endblock %}
