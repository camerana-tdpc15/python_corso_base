<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prenota</title>
    <!-- BS5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="#">Navbar</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                {% if g.user %}
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
                    </li>
                {% else %}
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('login') }}">Login</a>
                    </li>
                {% endif %}
            </ul>
        </div>
    </nav>

    <div class="container">

        <h1 class="text-center my-4">Prenota Lotto</h1>

        <div id="prenota-lotto">
            <!-- Dettagli del lotto da prenotare -->
        </div>

    </div>

    <footer class="footer mt-auto py-3 bg-light">
        <div class="container">
            <span class="text-muted">Place sticky footer content here.</span>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const lottoId = window.location.pathname.split('/').pop();
            fetch(`/api/lotti/${lottoId}`)
                .then(response => response.json())
                .then(data => {
                    const prenotaLotto = document.getElementById('prenota-lotto');
                    prenotaLotto.innerHTML = `
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">${data.rel_prodotto.nome_prodotto}</h5>
                                <p class="card-text">Produttore: ${data.rel_prodotto.rel_produttore.nome_produttore}</p>
                                <p class="card-text">Data consegna: ${data.get_date}</p>
                                <p class="card-text">Q.tà Disponibile: ${data.get_qta_disponibile} ${data.qta_unita_misura}</p>
                                <p class="card-text">Prezzo: ${data.get_prezzo_str}</p>
                                <a href="#" class="btn btn-primary">Conferma Prenotazione</a>
                            </div>
                        </div>
                    `;
                });
        });
    </script>
</body>
</html>
