<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guestbook</title>
    <link rel="stylesheet" href="style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-sm bg-secondary navbar-dark">
        <div class="container-fluid">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link active" href="#">Chi siamo</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Servizi</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('contatti') }}">Contatti</a>
            </li>
          </ul>
        </div>
      </nav>

    <h1>GUESTBOOK</h1>

    <div class="container mt-5">
       
        <p class="text-center mb-4">Lascia un messaggio sul nostro guestbook!</p>

    <!-- USO DEL FORM CON FETCH API -->
    <!-- In questo modo è Javascript a inviare la rischiesta e a leggere la risposta. -->
    <!-- (poi va invocata la funzione che recupera i messaggi e li mostra) -->
    <form id="msg-form">
        Nome: <input type="text" id="nome" name="nome" required>
        Messaggio: <input type="text" id="messaggio" name="messaggio" required>
        <button type="button" id="submit-btn" onclick="sendMessage()">
            Invia messaggio
        </button>
        <!-- ATTENZIONE: - Usiamo type="button" per evitare che il form venga
                           inviato automaticamente.
                         - Usiamo onclick= per invocare la funzione sendMessage()
                           invece di usare il submit del form o aggiungere un
                           eventListener (vedi script.js)  -->
                           
    </form>
   
    <!-- SPAZIO PER I MESSAGGI -->
    <h2>Messages</h2>
    <ul id="message-list">
        <!-- Qui dovranno essere inseriti i messaggi usando l'id del tag
             <ul> che in questo caso è "message-list"
        -->
    </ul>

    <!-- importa static/script.js -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <!--  NOTA BENE: è bene usare url_for() per generare il path corretto
                     anziché scrivere il path a mano. Così si evitano complicazioni
                     in caso di cambiamenti del path dell'applicazione.
    -->

    <img class="img-fluid" src="https://images.unsplash.com/photo-1489743342057-3448cc7c3bb9?q=80&w=2024&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Welcome"> 

</body>

</html>
